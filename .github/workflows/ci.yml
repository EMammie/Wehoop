name: CI

on:
  push:
    branches: [main, m5-modular]
  pull_request:
    branches: [main, m5-modular]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # macos-26 is GitHub's macOS 26 (arm64) image. The app targets iOS 26.2, so it
    # needs Xcode 26.2 or later; setup-xcode picks the newest stable Xcode on the image.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Module dependency rules
        run: scripts/check-deps.sh

      - name: Package tests (macOS, no simulator)
        run: swift test --package-path WehoopKit

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Wehoop \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 50
