# XcodeGen spec. `xcodegen generate` writes Wehoop.xcodeproj (git-ignored).
# The app has no xcconfig and no provider key: it talks only to wehoop-api.
name: Wehoop
options:
  bundleIdPrefix: com.ChallengerApp
  deploymentTarget:
    iOS: "26.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WehoopKit:
    path: WehoopKit
targets:
  Wehoop:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      # App -> every Feature*, Data, DesignSystem, Domain (docs/M5-PLAN.md)
      - package: WehoopKit
        product: Domain
      - package: WehoopKit
        product: Data
      - package: WehoopKit
        product: DesignSystem
      - package: WehoopKit
        product: FeatureScores
      - package: WehoopKit
        product: FeatureGame
      - package: WehoopKit
        product: FeaturePlayers
      - package: WehoopKit
        product: FeatureTeams
      - package: WehoopKit
        product: FeatureStandings
      - package: WehoopKit
        product: FeatureLeaders
      - package: WehoopKit
        product: FeatureFavorites
      - package: WehoopKit
        product: FeatureOnboarding
      - package: WehoopKit
        product: FeatureSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ChallengerApp.Wehoop
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wehoop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - AppTests
        - AppUITests
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Wehoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ChallengerApp.WehoopTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Wehoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ChallengerApp.WehoopUITests
        GENERATE_INFOPLIST_FILE: YES
